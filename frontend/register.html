<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Memoir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="header-container">
        <a href="index.html" class="logo">
            <span class="logo-emoji">📔</span>
            <span class="logo-text">Memoir</span>
        </a>
        <button class="mobile-nav-toggle" aria-label="Toggle menu" onclick="toggleMobileNav()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
        <div class="nav-actions">
            <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </div>
</header>

<div class="content">
    <div class="auth-card-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="subtitle">Join Memoir to start documenting your life journey.</p>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Choose a Username</label>
                    <input type="text" id="username" required placeholder="Username">
                </div>
                <div class="form-group">
                    <label for="password">Create a Password</label>
                    <input type="password" id="password" required placeholder="Password">
                </div>
                <div class="form-group">
                    <label for="regSecurityQuestion">Security Question</label>
                    <select id="regSecurityQuestion" required>
                        <option value="What was your first pet's name?">What was your first pet's name?</option>
                        <option value="What city were you born in?">What city were you born in?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What is your favorite book?">What is your favorite book?</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regSecurityAnswer">Security Answer</label>
                    <input type="text" id="regSecurityAnswer" required placeholder="Your answer (case-insensitive)">
                </div>
                <button type="submit" id="regSubmitBtn" class="btn btn-full" style="margin-top: 10px;">Register</button>
            </form>
            <div class="form-footer" style="justify-content: center; gap: 8px;">
                <span>Already have an account? <a href="login.html">Login here</a></span>
            </div>
        </div>
    </div>
</div>

<footer>
    <p><b>Memoir &copy; 2026</b></p>
</footer>

<!-- Include auth logic first -->
<script src="js/auth.js"></script>
<!-- Then UI logic -->
<script src="js/script.js"></script>
<script>
    async function handleRegister(event) {
        event.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const question = document.getElementById('regSecurityQuestion').value;
        const answer = document.getElementById('regSecurityAnswer').value.trim();
        const btn = document.getElementById('regSubmitBtn');
        
        btn.disabled = true;
        btn.innerText = 'Registering...';

        try {
            await Auth.register(user, pass, question, answer);
            showToast('Registration successful! Please login.', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
            btn.innerText = 'Register';
        }
    }
</script>
</body>
</html>
