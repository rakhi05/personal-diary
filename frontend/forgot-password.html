<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Personal Diary</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🔑 Reset Password</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>
</nav>

<div class="content" style="max-width: 400px; margin: 40px auto; text-align: center;">
    <h2>Recover Account</h2>
    
    <!-- Step 1: Username -->
    <div id="step1">
        <p style="margin-bottom: 15px; font-size: 0.95em;">Enter your username to retrieve your security question.</p>
        <div style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
            <label for="resetUsername">Username</label>
            <input type="text" id="resetUsername" required style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="Your username">
            <button onclick="Auth.checkSecurityQuestion()" style="width: 100%;">Continue</button>
        </div>
        <p style="margin-top: 20px;"><a href="login.html">Back to Login</a></p>
    </div>

    <!-- Step 2: Answer & New Password -->
    <div id="step2" style="display: none;">
        <form onsubmit="Auth.handleResetPassword(event)" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
            <div>
                <label>Security Question</label>
                <div id="displaySecurityQuestion" style="padding: 10px; background: #f8fafc; border-radius: 6px; margin-top: 5px; font-weight: bold; border-left: 4px solid #3b82f6;"></div>
            </div>
            
            <div>
                <label for="resetSecurityAnswer">Your Answer</label>
                <input type="text" id="resetSecurityAnswer" required style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="Answer (case-insensitive)">
            </div>

            <div>
                <label for="resetNewPassword">New Password</label>
                <input type="password" id="resetNewPassword" required style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="Enter new password">
            </div>

            <button type="submit" style="width: 100%; margin-top: 10px;">Reset Password</button>
        </form>
        <p style="margin-top: 20px;"><a href="login.html">Back to Login</a></p>
    </div>
</div>

<footer>
    <p><b>Personal Diary</b></p>
</footer>

<script src="js/auth.js"></script>
<script src="js/script.js"></script>
</body>
</html>
