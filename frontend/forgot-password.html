<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Memoir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="header-container">
        <a href="index.html" class="logo">
            <span class="logo-emoji">📔</span>
            <span class="logo-text">Memoir</span>
        </a>
        <button class="mobile-nav-toggle" aria-label="Toggle menu" onclick="toggleMobileNav()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
        <div class="nav-actions">
            <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </div>
</header>

<div class="content">
    <div class="auth-card-container">
        <div class="auth-card">
            <h2>Recover Account</h2>
            
            <!-- Step 1: Username -->
            <div id="step1">
                <p class="subtitle" style="margin-bottom: 24px;">Enter your username to retrieve your security question.</p>
                <div class="form-group">
                    <label for="resetUsername">Username</label>
                    <input type="text" id="resetUsername" required placeholder="Your username">
                </div>
                <button onclick="Auth.checkSecurityQuestion()" class="btn btn-full" style="margin-top: 10px;">Continue</button>
                <div class="form-footer" style="justify-content: center; margin-top: 24px;">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>

            <!-- Step 2: Answer & New Password -->
            <div id="step2" style="display: none;">
                <p class="subtitle" style="margin-bottom: 24px;">Answer your security question to reset password.</p>
                <form onsubmit="Auth.handleResetPassword(event)">
                    <div class="form-group">
                        <label>Security Question</label>
                        <div id="displaySecurityQuestion" style="padding: 12px 14px; background: var(--bg-color); border-radius: 8px; font-weight: 600; border-left: 4px solid var(--primary-color); font-size: 14px; color: var(--text-color);"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="resetSecurityAnswer">Your Answer</label>
                        <input type="text" id="resetSecurityAnswer" required placeholder="Answer (case-insensitive)">
                    </div>

                    <div class="form-group">
                        <label for="resetNewPassword">New Password</label>
                        <input type="password" id="resetNewPassword" required placeholder="Enter new password">
                    </div>

                    <button type="submit" class="btn btn-full" style="margin-top: 15px;">Reset Password</button>
                </form>
                <div class="form-footer" style="justify-content: center; margin-top: 24px;">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <p><b>Memoir &copy; 2026</b></p>
</footer>

<script src="js/auth.js"></script>
<script src="js/script.js"></script>
</body>
</html>
