<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Entry - Memoir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="header-container">
        <a href="index.html" class="logo">
            <span class="logo-emoji">📔</span>
            <span class="logo-text">Memoir</span>
        </a>
        <button class="mobile-nav-toggle" aria-label="Toggle menu" onclick="toggleMobileNav()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="write.html">Write Diary</a>
            <a href="entries.html">My Entries</a>
            <a href="calendar.html">Calendar</a>
            <a href="about.html">About</a>
        </nav>
        <div class="nav-actions">
            <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </div>
</header>

<div class="content">
    <div class="diary-write-container">
        <h2>New Diary Entry</h2>
        
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date">
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Diary Title">
        </div>

        <div class="mood-selection">
            <div class="mood-header">
                <label>How are you feeling today?</label>
                <button type="button" class="ai-btn" id="autoMoodBtn" onclick="autoDetectMood()">✨ Auto-Detect</button>
            </div>
            <div class="mood-options">
                <button type="button" class="mood-btn" data-mood="Happy" onclick="selectMood('Happy')">
                    <span>😊</span><span>Happy</span>
                </button>
                <button type="button" class="mood-btn" data-mood="Sad" onclick="selectMood('Sad')">
                    <span>😢</span><span>Sad</span>
                </button>
                <button type="button" class="mood-btn" data-mood="Angry" onclick="selectMood('Angry')">
                    <span>😠</span><span>Angry</span>
                </button>
                <button type="button" class="mood-btn" data-mood="Excited" onclick="selectMood('Excited')">
                    <span>🤩</span><span>Excited</span>
                </button>
                <button type="button" class="mood-btn" data-mood="Neutral" onclick="selectMood('Neutral')">
                    <span>😐</span><span>Neutral</span>
                </button>
            </div>
            <input type="hidden" id="selectedMood" value="Neutral">
        </div>

        <div class="form-group">
            <label for="content">Thoughts</label>
            <textarea id="content" placeholder="Write your thoughts here..."></textarea>
        </div>

        <!-- IMAGE UPLOAD ZONE -->
        <div class="form-group">
            <label>Attach Image</label>
            <div class="upload-zone" id="uploadZone"
                 onclick="document.getElementById('imageInput').click()"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)"
                 ondrop="handleDrop(event)"
                 role="button"
                 aria-label="Upload an image for your diary entry">
                <input type="file" id="imageInput" accept="image/*"
                       onchange="handleImageUpload(event)" style="display:none">
                <div class="upload-icon">🖼️</div>
                <p class="upload-text">Click or drag &amp; drop an image <span>(Optional)</span></p>
                <p class="upload-hint">JPG · PNG · GIF · WEBP &nbsp;—&nbsp; Max 3 MB</p>
            </div>

            <!-- IMAGE PREVIEW (shown after a file is chosen) -->
            <div class="img-preview-wrapper" id="imgPreviewWrapper">
                <img id="imgPreview" src="" alt="Selected image preview">
                <button type="button" class="clear-img-btn"
                        onclick="clearImagePreview()" title="Remove image">✕ Remove</button>
            </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 24px; border-top: 1px solid var(--card-border); padding-top: 20px;">
            <button onclick="saveDiary()" class="btn">💾 Save Entry</button>
            <span id="draftStatus" style="color: var(--text-muted); font-size: 0.9em; font-style: italic;"></span>
        </div>
    </div>
</div>

<footer>
    <p><b>Memoir &copy; 2026</b></p>
</footer>

<script src="js/auth.js"></script>
<script src="js/ai.js"></script>
<script src="js/script.js"></script>

</body>
</html>
