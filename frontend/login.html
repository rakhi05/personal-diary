<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Memoir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="header-container">
        <a href="index.html" class="logo">
            <span class="logo-emoji">📔</span>
            <span class="logo-text">Memoir</span>
        </a>
        <button class="mobile-nav-toggle" aria-label="Toggle menu" onclick="toggleMobileNav()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
        <div class="nav-actions">
            <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </div>
</header>

<div class="content">
    <div class="auth-card-container">
        <div class="auth-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Please login to access your personal journal.</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" id="loginSubmitBtn" class="btn btn-full" style="margin-top: 10px;">Login</button>
            </form>
            <div class="form-footer">
                <a href="forgot-password.html">Forgot Password?</a>
                <span>Don't have an account? <a href="register.html">Register</a></span>
            </div>
        </div>
    </div>
</div>

<footer>
    <p><b>Memoir &copy; 2026</b></p>
</footer>

<!-- Include auth logic first -->
<script src="js/auth.js"></script>
<!-- Then UI logic -->
<script src="js/script.js"></script>
<script>
    async function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginSubmitBtn');
        
        btn.disabled = true;
        btn.innerText = 'Logging in...';

        try {
            await Auth.login(user, pass);
            showToast('Login successful!', 'success');
            setTimeout(() => {
                window.location.href = 'entries.html';
            }, 1000);
        } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
            btn.innerText = 'Login';
        }
    }
</script>
</body>
</html>
